[project]
name = "naha-superapp-backend"
version = "0.1.0"
description = "WhatsApp-first everyday-services platform backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0.43,<3",
  "asyncpg>=0.30,<1",
  "httpx>=0.28,<1",
  "PyJWT>=2.10,<3",
  "redis>=6,<7",
  "structlog>=25,<26",
  "email-validator>=2.3,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=1,<2", "respx>=0.22,<1", "ruff>=0.12,<1", "mypy>=1.17,<2"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"

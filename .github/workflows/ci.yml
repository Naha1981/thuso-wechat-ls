name: THUSO CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e ".[test]"
      - name: Compile
        run: python -m compileall app
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest -q tests/test_ai_gateway.py
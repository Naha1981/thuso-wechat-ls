name: THUSO CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -e ".[test]"
      - name: Compile backend
        run: python -m compileall app tests
      - name: Lint release surface
        run: >
          ruff check
          app/ai
          app/api/ai.py
          app/api/admin.py
          app/agent
          app/core/admin_auth.py
          app/core/config.py
          app/core/crypto.py
          app/core/startup.py
          app/services/ai_assistant.py
          app/services/ai_usage.py
          app/services/econet_integration.py
          tests/test_ai_gateway.py
          tests/test_control_plane.py
      - name: Backend tests
        run: pytest -q tests

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install web dependencies
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Build web
        working-directory: web
        run: npm run build

  operator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install operator dependencies
        working-directory: operator
        run: npm install --no-audit --no-fund
      - name: Typecheck operator
        working-directory: operator
        run: npm run typecheck
